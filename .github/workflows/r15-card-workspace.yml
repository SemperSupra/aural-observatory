name: R15 card-workspace real-browser qualification
on:
  pull_request:
    paths:
      - 'src/AuralObservatory.SearchDesktop/**'
      - 'tests/desktop-e2e/r15-card-deck.cjs'
      - '.github/workflows/r15-card-workspace.yml'
  push:
    branches: ['feat/r15-desktop-card-workspace']
    paths:
      - 'src/AuralObservatory.SearchDesktop/**'
      - 'tests/desktop-e2e/r15-card-deck.cjs'
      - '.github/workflows/r15-card-workspace.yml'
permissions:
  contents: read
concurrency:
  group: r15-card-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      AURAL_R15_BROWSER: ${{ matrix.browser }}
      AURAL_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: {dotnet-version: '10.0.x'}
      - name: Install pinned browser qualification dependencies
        working-directory: tests/desktop-e2e
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install browser
        working-directory: tests/desktop-e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise local-host card UX, safety, keyboard, and axe
        run: node tests/desktop-e2e/r15-card-deck.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r15-card-${{ matrix.browser }}
          path: artifacts/ui/r15-card-deck/
          retention-days: 7
          if-no-files-found: warn
