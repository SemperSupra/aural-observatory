name: R11 native C ABI called by current C# core (synthetic only)
on:
  pull_request:
    paths:
      - 'experiments/portable-core/ffi-dotnet/**'
      - 'experiments/portable-core/c17/**'
      - 'src/AuralObservatory.Core/NotchResponseAnalysis.cs'
      - '.github/workflows/r11-csharp-native-ffi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet-c-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Compile candidate C17 library without device/audio dependencies
        run: |
          cc -std=c17 -O2 -fPIC -shared -Wall -Wextra -Werror experiments/portable-core/c17/aural_r11_kernel.c -lm -o experiments/portable-core/ffi-dotnet/libaural-r11-candidate.so
      - name: Verify .NET 10 P/Invoke and C# reference oracle numerical parity
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/experiments/portable-core/ffi-dotnet
        run: dotnet run --project experiments/portable-core/ffi-dotnet/NativeProbe.csproj --configuration Release
