name: R14 three-audience journey evidence and release-gap lint
on:
  pull_request:
    paths:
      - 'docs/evaluation/r14/**'
      - 'scripts/evaluation/r14/**'
      - '.github/workflows/r14-journey-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enumerate-and-constrain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify complete Human / Automation / Agent journey evidence
        run: python scripts/evaluation/r14/check_journeys.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r14-journey-gap-report-${{ runner.os }}
          path: artifacts/evaluation/r14
          retention-days: 14
          if-no-files-found: error
