name: R15 evidence integrity - validated cross-browser A/B receipts
on:
  pull_request:
    paths:
      - 'docs/evaluation/r15/AB-VERIFIED-RECEIPTS.json'
      - 'scripts/r15-ab-verify-receipts.cjs'
      - '.github/workflows/r15-ab-evidence-integrity.yml'
permissions:
  contents: read
concurrency:
  group: r15-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate source, provenance, complete paired metric grid and safety limits
        run: node scripts/r15-ab-verify-receipts.cjs docs/evaluation/r15/AB-VERIFIED-RECEIPTS.json
      - name: Prove validator refuses tampered evidence
        run: |
          node - <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),os=require('node:os'),path=require('node:path');
          const source='docs/evaluation/r15/AB-VERIFIED-RECEIPTS.json';
          const tmp=path.join(os.tmpdir(),'r15-contradictory-evidence-'+process.pid+'.json');
          const data=JSON.parse(fs.readFileSync(source));
          data.pairs[0].cardScroll=data.pairs[0].longScroll+1;
          fs.writeFileSync(tmp,JSON.stringify(data));
          const result=cp.spawnSync(process.execPath,['scripts/r15-ab-verify-receipts.cjs',tmp],{encoding:'utf8'});
          fs.unlinkSync(tmp);
          if(result.status===0)throw Error('Validator accepted a scroll regression / tampered receipt');
          console.log('PASS known-negative tampered metric rejected');
          JS
