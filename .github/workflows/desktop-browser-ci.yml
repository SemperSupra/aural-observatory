name: R9 desktop real-browser UI / accessibility smoke
on:
  pull_request:
    paths:
      - 'src/AuralObservatory.SearchDesktop/**'
      - 'tests/desktop-e2e/**'
      - '.github/workflows/desktop-browser-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: {dotnet-version: '10.0.x'}
      - name: Install pinned browser test libraries
        working-directory: tests/desktop-e2e
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium and dependencies
        working-directory: tests/desktop-e2e
        run: npx playwright install --with-deps chromium
      - name: Real-browser UI + axe checks, synthetic fixture only
        working-directory: tests/desktop-e2e
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r9-desktop-browser-evidence
          path: artifacts/ui/desktop-browser-smoke.json
          retention-days: 14
          if-no-files-found: warn
