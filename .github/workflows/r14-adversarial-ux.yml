name: R14 Adversarial UI journeys — Chromium Firefox WebKit form factors
on:
  pull_request:
    paths:
      - 'src/AuralObservatory.SearchDesktop/wwwroot/mobile-controller.js'
      - 'tests/desktop-e2e/r14-adversarial-ux.cjs'
      - '.github/workflows/r14-adversarial-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey-attacks:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      AURAL_R14_BROWSER: ${{ matrix.browser }}
      AURAL_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned browser test tools
        working-directory: tests/desktop-e2e
        run: npm install --no-audit --no-fund
      - name: Install one browser per independent runner
        working-directory: tests/desktop-e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise actual R13 desktop-host UX and adversarial authority
        run: node tests/desktop-e2e/r14-adversarial-ux.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r14-adversarial-${{ matrix.browser }}
          path: artifacts/evaluation/r14/browser/
          retention-days: 14
          if-no-files-found: warn
