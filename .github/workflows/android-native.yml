name: Native Android + cross-platform core
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: DSP core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/AuralObservatory.Core.Tests/AuralObservatory.Core.Tests.csproj --configuration Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted SDK manager is not always on PATH.
      - name: Resolve SDK manager and install Android API 36
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - run: dotnet workload install android
      - run: dotnet build src/AuralObservatory.Android/AuralObservatory.Android.csproj -c Debug
      - name: Upload debug-only test APK
        uses: actions/upload-artifact@v4
        with:
          name: aural-observatory-native-debug-unsigned-for-qualification
          path: 'src/AuralObservatory.Android/bin/Debug/net10.0-android/**/*.apk'
          if-no-files-found: warn
  sensors:
    name: Sensor protocol + BLE integration compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/AuralObservatory.Sensors.Tests/AuralObservatory.Sensors.Tests.csproj --configuration Release
      - run: dotnet build src/AuralObservatory.SensorConsole/AuralObservatory.SensorConsole.csproj --configuration Release
