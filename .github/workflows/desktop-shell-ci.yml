name: R9 desktop launcher and lifecycle qualification
on:
  pull_request:
    paths:
      - 'src/AuralObservatory.SearchDesktop/**'
      - 'tests/AuralObservatory.DesktopShell.Tests/**'
      - '.github/workflows/desktop-shell-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  desktop:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: {dotnet-version: '10.0.x'}
      - run: dotnet run --project tests/AuralObservatory.DesktopShell.Tests/AuralObservatory.DesktopShell.Tests.csproj -c Release
      - run: dotnet build src/AuralObservatory.SearchDesktop/AuralObservatory.SearchDesktop.csproj -c Release
