name: R15 controlled card-vs-scroll usability-proxy RDTE
on:
  pull_request:
    paths:
      - 'tests/desktop-e2e/r15-card-ab-rdte.cjs'
      - 'docs/R15-CARD-AB-CLOUD-RDTE.md'
      - '.github/workflows/r15-card-ab-rdte.yml'
      - 'src/AuralObservatory.SearchDesktop/**'
  push:
    branches: ['test/r15-card-ab-cloud-rdte']
    paths:
      - 'tests/desktop-e2e/r15-card-ab-rdte.cjs'
      - 'docs/R15-CARD-AB-CLOUD-RDTE.md'
      - '.github/workflows/r15-card-ab-rdte.yml'
      - 'src/AuralObservatory.SearchDesktop/**'
permissions: {contents: read}
concurrency:
  group: r15-ab-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      AURAL_R15_AB_BROWSER: ${{ matrix.engine }}
      AURAL_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: {dotnet-version: '10.0.x'}
      - name: Install pinned browser-only test harness
        working-directory: tests/desktop-e2e
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install real browser and OS dependencies
        working-directory: tests/desktop-e2e
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Paired navigation and layout RDTE on C# localhost host
        run: node tests/desktop-e2e/r15-card-ab-rdte.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r15-card-ab-${{ matrix.engine }}
          path: artifacts/ui/r15-ab-rdte/
          retention-days: 14
          if-no-files-found: warn
