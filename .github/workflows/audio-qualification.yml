name: R8 actual-generated-audio spectral qualification
on:
  pull_request:
    paths:
      - 'src/AuralObservatory.Core/**'
      - 'tests/AuralObservatory.Audio.Tests/**'
      - '.github/workflows/audio-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectrum:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Analyze generated C# engine PCM spectra, channel isolation and peak levels
        run: dotnet run --project tests/AuralObservatory.Audio.Tests/AuralObservatory.Audio.Tests.csproj --configuration Release
      - name: Save numerical evidence — no raw user audio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r8-digital-qualification-${{ matrix.os }}
          path: artifacts/audio/synthetic-spectra.json
          if-no-files-found: error
          retention-days: 14
